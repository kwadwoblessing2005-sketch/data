<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCOREBET — Educational Demo</title>
<style>
:root{--green:#7cff67;--bg:#0b1015;--panel:#141b22;--panel2:#1a232c;--text:#f4f7f5;--muted:#98a3ad;--yellow:#ffd83d;--red:#ff6262;--line:#29333d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.banner{background:var(--yellow);color:#171900;text-align:center;font-weight:900;padding:9px;letter-spacing:.6px;position:sticky;top:0;z-index:20}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#10161c;border-bottom:1px solid var(--line);position:sticky;top:35px;z-index:19}.logo{font-size:25px;font-weight:950;color:white;text-decoration:none}.logo span{color:var(--green)}.nav{display:flex;gap:5px;align-items:center}.nav button,.user-chip{border:0;background:transparent;color:#cbd4da;padding:10px;border-radius:7px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:#252f38;color:var(--green)}.user-chip{border:1px solid var(--line)}.hidden{display:none!important}.page{max-width:1200px;margin:auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}.auth-wrap{min-height:calc(100vh - 130px);display:grid;place-items:center}.auth-card{width:min(440px,100%)}h1,h2,h3{margin-top:0}h2{font-size:22px}.muted{color:var(--muted)}.accent{color:var(--green)}input,select{width:100%;background:#0d1318;border:1px solid var(--line);color:white;border-radius:7px;padding:12px;margin:7px 0 14px;outline:none}input:focus,select:focus{border-color:var(--green)}label{font-size:13px;font-weight:700;color:#cbd4da}.btn{border:0;border-radius:7px;padding:11px 16px;background:var(--green);color:#091109;font-weight:900;cursor:pointer}.btn:hover{filter:brightness(.92)}.btn.secondary{background:#29343e;color:white}.btn.danger{background:var(--red);color:white}.btn.small{padding:8px 10px;font-size:13px}.link-btn{background:none;border:0;color:var(--green);font-weight:800;cursor:pointer}.demo-note{color:var(--yellow);font-size:12px;font-weight:800;text-align:center;margin-top:15px}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.match-card{display:grid;grid-template-columns:minmax(220px,1fr) repeat(3,92px);gap:10px;align-items:center;background:var(--panel2);padding:16px;border-radius:9px;margin-bottom:10px;border:1px solid var(--line)}.teams{font-weight:850}.match-meta{font-size:12px;color:var(--muted);margin-top:4px}.odds{height:46px;background:#303c47;border:1px solid #465461;border-radius:6px;color:white;font-weight:850;cursor:pointer}.odds small{display:block;color:var(--muted);font-size:10px}.odds:hover,.odds.selected{background:var(--green);color:#102010;border-color:var(--green)}.odds.selected small{color:#102010}.slip{position:sticky;top:122px}.selection{border-left:3px solid var(--green);background:#0f161c;padding:12px;margin-bottom:12px}.selection strong{display:block;margin-bottom:7px}.potential{display:flex;justify-content:space-between;font-weight:900;font-size:18px;background:#0d1318;padding:13px;border-radius:7px;margin-bottom:12px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;background:var(--panel);min-width:700px}.data-table th,.data-table td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}.data-table th{font-size:12px;color:var(--muted);text-transform:uppercase}.status{padding:5px 8px;border-radius:20px;font-size:12px;font-weight:900}.status.pending{background:#665c24;color:#fff2a8}.status.approved{background:#235e34;color:#b6ffc4}.status.lost{background:#663131;color:#ffc7c7}.status.pending-bet{background:#324b63;color:#cfe5ff}.two-col{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.balance{font-size:38px;font-weight:950;color:var(--green)}.admin-tools{display:flex;gap:8px;flex-wrap:wrap}.admin-tools input{width:220px;margin:0}.toast{position:fixed;right:20px;bottom:20px;background:#26313a;border-left:4px solid var(--green);padding:14px 18px;border-radius:7px;z-index:50;box-shadow:0 10px 30px #0008;max-width:320px}.toast.error{border-color:var(--red)}.menu-toggle{display:none;background:none;border:0;color:white;font-size:24px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){header{padding:0 12px}.menu-toggle{display:block}.nav{display:none;position:absolute;top:68px;left:0;right:0;background:#10161c;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}.nav.open{display:flex}.dashboard-grid,.two-col{grid-template-columns:1fr}.match-card{grid-template-columns:1fr repeat(3,1fr)}.slip{position:static}.page{padding:16px 12px}.data-table{min-width:600px}.balance{font-size:32px}}@media(max-width:430px){.match-card{grid-template-columns:1fr}.odds{height:43px}.admin-tools input{width:100%}}
</style>
</head>
<body>
<div class="banner">EDUCATIONAL DEMO — NO REAL MONEY • DEMO BALANCE ONLY</div>
<header class="hidden" id="appHeader"><a class="logo" href="#dashboard">SCORE<span>BET</span></a><button class="menu-toggle" onclick="toggleMenu()">☰</button><nav class="nav" id="nav"></nav><span class="user-chip hidden" id="userChip"></span></header>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
const DB_KEY='scorebet_demo_db_v1', SESSION_KEY='scorebet_demo_session';
// Replace this storage adapter with API calls for MySQL integration.
const Store={get(){const raw=localStorage.getItem(DB_KEY);if(raw)return JSON.parse(raw);return null},save(db){localStorage.setItem(DB_KEY,JSON.stringify(db))}};
function seed(){return {users:[{id:'admin-id',fullName:'Administrator',email:'admin@demo.local',username:'admin',password:'admin123',phone:'',balance:0,role:'admin'}],matches:[{id:'m1',home:'Man United',away:'Arsenal',start:'Today • 20:00',odds:{home:2.35,draw:3.20,away:2.90}},{id:'m2',home:'Barcelona',away:'Real Madrid',start:'Today • 21:30',odds:{home:2.10,draw:3.40,away:3.25}}],bets:[],requests:[]}}
let db=Store.get()||seed(); Store.save(db); let session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); let selected=null;
const app=document.getElementById('app'),header=document.getElementById('appHeader'),nav=document.getElementById('nav'),userChip=document.getElementById('userChip');
function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' DEMO'}
function current(){return db.users.find(u=>u.id===session?.userId)}
function save(){Store.save(db)}
function toast(msg,error=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3500)}
function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showAuth(){header.classList.add('hidden');renderAuth(location.hash==='#signup'?'signup':'signin')}
function renderAuth(mode='signin'){document.querySelector('.nav')?.classList.remove('open');app.innerHTML=`<main class="page auth-wrap"><section class="card auth-card"><h1>${mode==='signup'?'Create Demo Account':'Sign in to SCOREBET'}</h1><p class="muted">Class project • no real betting or payments.</p><form id="authForm">${mode==='signup'?`<label>Full name</label><input name="fullName" required><label>Email</label><input name="email" type="email" required><label>Phone</label><input name="phone" required>`:''}<label>Username</label><input name="username" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="${mode==='signup'?'new-password':'current-password'}"><button class="btn" style="width:100%;margin-top:5px">${mode==='signup'?'Create demo account':'Sign In'}</button></form><p>${mode==='signup'?'Already have an account?':'New here?' } <button class="link-btn" onclick="location.hash='${mode==='signup'?'signin':'signup'}'">${mode==='signup'?'Sign in':'Sign up'}</button></p><div class="demo-note">DEMO BALANCE ONLY — NO REAL MONEY</div></section></main>`;
document.getElementById('authForm').addEventListener('submit',mode==='signup'?signup:signin)}
function signup(e){e.preventDefault();const f=new FormData(e.target),username=f.get('username').trim();if(db.users.some(u=>u.username.toLowerCase()===username.toLowerCase()))return toast('Username already exists',true);const u={id:uid('user'),fullName:f.get('fullName').trim(),email:f.get('email').trim(),username,password:f.get('password'),phone:f.get('phone').trim(),balance:1250,role:'user'};db.users.push(u);save();session={userId:u.id};localStorage.setItem(SESSION_KEY,JSON.stringify(session));toast('Account created with $1250 demo balance');location.hash='dashboard'}
function signin(e){e.preventDefault();const f=new FormData(e.target);const u=db.users.find(x=>x.username===f.get('username')&&x.password===f.get('password'));if(!u)return toast('Invalid username or password',true);session={userId:u.id};localStorage.setItem(SESSION_KEY,JSON.stringify(session));location.hash=u.role==='admin'?'admin':'dashboard';toast('Signed in successfully')}
function toggleMenu(){nav.classList.toggle('open')}
function logout(){session=null;localStorage.removeItem(SESSION_KEY);selected=null;location.hash='signin'}
function setupApp(){header.classList.remove('hidden');const u=current();if(!u)return logout();userChip.classList.remove('hidden');userChip.textContent=u.username+' • '+money(u.balance);let items=u.role==='admin'?[['admin','Admin Panel']]:[['dashboard','Dashboard'],['bets','My Bets'],['deposit','Demo Deposit'],['withdraw','Demo Withdraw']];nav.innerHTML=items.map(([h,t])=>`<button data-page="${h}" onclick="navigate('${h}')">${t}</button>`).join('')+'<button onclick="logout()">Logout</button>';nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===location.hash.slice(1)));nav.classList.remove('open')}
function navigate(page){location.hash=page}
function render(){if(!session||!current()){showAuth();return}setupApp();const hash=location.hash.slice(1)||'dashboard'; const u=current();if(u.role==='admin'&&hash!=='admin'){location.hash='admin';return}if(hash==='admin'&&u.role!=='admin'){location.hash='dashboard';return}nav.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===hash)); if(hash==='dashboard')renderDashboard();else if(hash==='bets')renderBets();else if(hash==='deposit')renderDeposit();else if(hash==='withdraw')renderWithdraw();else if(hash==='admin')renderAdmin();else renderDashboard()}
function renderDashboard(){const u=current();app.innerHTML=`<main class="page"><div style="display:flex;justify-content:space-between;align-items:end"><div><h1>Football</h1><p class="muted">Live demo markets</p></div><div><span class="muted">Demo balance</span><div class="balance" style="font-size:25px">${money(u.balance)}</div></div></div><div class="dashboard-grid"><section>${db.matches.map(m=>`<div class="match-card"><div><div class="teams">${esc(m.home)} <span class="muted">vs</span> ${esc(m.away)}</div><div class="match-meta">${esc(m.start)} • LIVE DEMO</div></div>${oddsButton(m,'home','1')}${oddsButton(m,'draw','X')}${oddsButton(m,'away','2')}</div>`).join('')}</section><aside class="card slip"><h2>Bet Slip</h2><div id="slipBody"></div></aside></div></main>`;updateSlip()}
function oddsButton(m,key,label){const active=selected?.matchId===m.id&&selected.key===key?' selected':'';return `<button class="odds${active}" onclick="choose('${m.id}','${key}','${esc(m.home)} vs ${esc(m.away)}','${label}')"><small>${label}</small>${Number(m.odds[key]).toFixed(2)}</button>`}
function choose(id,key,teams,label){const m=db.matches.find(x=>x.id===id);selected={matchId:id,key,label,teams,odds:Number(m.odds[key])};renderDashboard()}
function updateSlip(){const el=document.getElementById('slipBody');if(!el)return;if(!selected){el.innerHTML='<div class="empty">Select an odds button to build your demo slip.</div>';return}el.innerHTML=`<div class="selection"><strong>${esc(selected.teams)}</strong><span class="muted">Selection:</span> ${esc(selected.label)} &nbsp; <span class="accent">${selected.odds.toFixed(2)}</span></div><label>Demo stake</label><input id="stake" type="number" min="0.01" step="0.01" value="10" oninput="updatePotential()"><div class="potential"><span>Potential win</span><span class="accent" id="potential">${money(selected.odds*10)}</span></div><button class="btn" style="width:100%" onclick="placeBet()">Place Demo Bet</button><div class="demo-note">NO REAL MONEY</div>`}
function updatePotential(){const stake=Number(document.getElementById('stake')?.value||0);document.getElementById('potential').textContent=money(stake*selected.odds)}
function placeBet(){const stake=Number(document.getElementById('stake')?.value||0),u=current();if(!selected)return toast('Select an odds first',true);if(!Number.isFinite(stake)||stake<=0)return toast('Enter a valid stake',true);if(stake>u.balance)return toast('Insufficient demo balance',true);u.balance=round(u.balance-stake);db.bets.push({id:uid('bet'),userId:u.id,username:u.username,matchName:selected.teams,selection:selected.label,odds:selected.odds,stake,potential:round(stake*selected.odds),status:'Pending',date:new Date().toISOString()});save();setupApp();selected=null;toast('Demo bet placed');renderDashboard()}
function round(n){return Math.round((n+Number.EPSILON)*100)/100}
function renderBets(){const u=current(),bets=db.bets.filter(b=>b.userId===u.id).reverse();app.innerHTML=`<main class="page"><h1>My Demo Bets</h1><div class="table-wrap"><table class="data-table"><thead><tr><th>Match</th><th>Selection</th><th>Odds</th><th>Stake</th><th>Potential Win</th><th>Status</th><th>Date</th></tr></thead><tbody>${bets.length?bets.map(b=>`<tr><td>${esc(b.matchName)}</td><td>${esc(b.selection)}</td><td>${Number(b.odds).toFixed(2)}</td><td>${money(b.stake)}</td><td>${money(b.potential)}</td><td><span class="status pending-bet">${esc(b.status)}</span></td><td>${new Date(b.date).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No demo bets yet.</td></tr>'}</tbody></table></div></main>`}
function renderDeposit(){app.innerHTML=`<main class="page"><div class="two-col"><section class="card"><h1>Demo Deposit</h1><p class="muted">This creates a request only. No real payment is made.</p><form id="depositForm"><label>Amount (demo)</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Method</label><select name="method"><option>MTN MoMo Demo</option><option>Vodafone Cash Demo</option></select><button class="btn">Submit Demo Request</button></form></section><section class="card"><h3>Your Demo Balance</h3><div class="balance">${money(current().balance)}</div></section></div></main>`;document.getElementById('depositForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return toast('Enter a valid amount',true);const u=current();db.requests.push({id:uid('req'),type:'deposit',userId:u.id,username:u.username,amount:round(amount),method:f.get('method'),status:'Pending',date:new Date().toISOString()});save();e.target.reset();toast('Deposit request sent to admin')}}
function renderWithdraw(){app.innerHTML=`<main class="page"><div class="two-col"><section class="card"><h1>Demo Withdrawal</h1><p class="muted">This creates a request only. No real money is sent.</p><form id="withdrawForm"><label>Amount (demo)</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Demo mobile money number</label><input name="number" inputmode="numeric" required placeholder="Demo number"><button class="btn">Submit Demo Request</button></form></section><section class="card"><h3>Your Demo Balance</h3><div class="balance">${money(current().balance)}</div></section></div></main>`;document.getElementById('withdrawForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount')),u=current();if(amount<=0)return toast('Enter a valid amount',true);if(amount>u.balance)return toast('Amount exceeds demo balance',true);db.requests.push({id:uid('req'),type:'withdraw',userId:u.id,username:u.username,amount:round(amount),number:f.get('number'),status:'Pending',date:new Date().toISOString()});save();e.target.reset();toast('Withdrawal request sent to admin')}}
function renderAdmin(){const deposits=db.requests.filter(r=>r.type==='deposit'&&r.status==='Pending'),withdrawals=db.requests.filter(r=>r.type==='withdraw'&&r.status==='Pending');app.innerHTML=`<main class="page"><h1>Admin Control Panel</h1><p class="muted">Manage demo accounts, requests, and markets.</p><section class="card" style="margin-bottom:18px"><h2>User Balance Control</h2><div class="admin-tools"><input id="adminUser" placeholder="Search exact username"><button class="btn small" onclick="findUser()">Search</button></div><div id="userResult" style="margin-top:12px"></div></section><div class="two-col"><section class="card"><h2>Pending Deposits</h2><div class="table-wrap">${requestTable(depos,'deposit')}</div></section><section class="card"><h2>Pending Withdrawals</h2><div class="table-wrap">${requestTable(withdrawals,'withdraw')}</div></section></div><section class="card" style="margin-top:18px"><h2>Add New Match</h2><form id="matchForm"><div class="two-col"><div><label>Home team</label><input name="home" required></div><div><label>Away team</label><input name="away" required></div></div><label>Start (example: Tomorrow • 18:00)</label><input name="start" required><div class="two-col"><div><label>Home odds (1)</label><input name="homeOdds" type="number" min="1" step="0.01" required></div><div><label>Draw odds (X)</label><input name="drawOdds" type="number" min="1" step="0.01" required></div></div><label>Away odds (2)</label><input name="awayOdds" type="number" min="1" step="0.01" required><button class="btn">Add Match</button></form></section></main>`;document.getElementById('matchForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!f.get('home').trim()||!f.get('away').trim())return toast('Enter both teams',true);db.matches.push({id:uid('match'),home:f.get('home').trim(),away:f.get('away').trim(),start:f.get('start').trim(),odds:{home:Number(f.get('homeOdds')),draw:Number(f.get('drawOdds')),away:Number(f.get('awayOdds'))}});save();e.target.reset();toast('Match added')}}
function requestTable(rows,type){if(!rows.length)return '<div class="empty">No pending requests.</div>';return `<table class="data-table"><thead><tr><th>User</th><th>Amount</th><th>${type==='deposit'?'Method':'Number'}</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.username)}</td><td>${money(r.amount)}</td><td>${esc(type==='deposit'?r.method:r.number)}</td><td><button class="btn small" onclick="approve('${r.id}')">Approve</button></td></tr>`).join('')}</tbody></table>`}
function findUser(){const name=document.getElementById('adminUser').value.trim(),u=db.users.find(x=>x.username.toLowerCase()===name.toLowerCase()&&x.role==='user'),el=document.getElementById('userResult');if(!u){el.innerHTML='<div class="empty">User not found.</div>';return}el.innerHTML=`<div class="card" style="background:#0d1318"><strong>${esc(u.username)}</strong> — <span class="accent">${money(u.balance)}</span><div class="admin-tools" style="margin-top:12px"><input id="creditAmount" type="number" min="0.01" step="0.01" placeholder="Demo amount"><button class="btn small" onclick="adjustUser('${u.id}',1)">Add Demo Credits</button><button class="btn danger small" onclick="adjustUser('${u.id}',-1)">Remove Demo Credits</button></div></div>`}
function adjustUser(id,sign){const u=db.users.find(x=>x.id===id),amount=Number(document.getElementById('creditAmount').value);if(!u||!Number.isFinite(amount)||amount<=0)return toast('Enter a valid amount',true);if(sign<0&&amount>u.balance)return toast('Cannot remove more than the demo balance',true);u.balance=round(u.balance+sign*amount);save();setupApp();findUser();toast(sign>0?'Demo credits added':'Demo credits removed')}
function approve(id){const r=db.requests.find(x=>x.id===id),u=db.users.find(x=>x.id===r?.userId);if(!r||r.status==='Approved'||!u)return;if(r.type==='withdraw'&&r.amount>u.balance)return toast('Insufficient demo balance for approval',true);u.balance=round(u.balance+(r.type==='deposit'?r.amount:-r.amount));r.status='Approved';save();setupApp();renderAdmin();toast(r.type==='deposit'?'Deposit approved':'Withdrawal approved')}
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(!session&&page!=='signup'){showAuth();return}if(!session&&page==='signup'){showAuth();return}render()});
if(!session){showAuth()}else if(location.hash==='')location.hash=current()?.role==='admin'?'admin':'dashboard';else render();
</script>
</body>
</html>
